<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<text x="62" y="24" font-size="14" fill="#767e88" text-anchor="start" font-weight="600">The two designs, and what each bit of the field buys</text>
<text x="62" y="41" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal">The diameter pays for the whole field. What the field buys depends on how much of it goes to integrity: one bit for a flag, seven for a checksum.</text>
<text x="62" y="56" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal">The checksum costs one more bit of carrier and five bits of state, and buys a false accept rate of 1 in 128 instead of 1 in 2, plus detection of a</text>
<text x="62" y="71" font-size="11" fill="#8b949e" text-anchor="start" font-weight="normal">carrier that something else has overwritten, which the flag cannot see at all.</text>
<line x1="62" y1="328" x2="690" y2="328" stroke="#8b949e" stroke-opacity="0.13"/>
<text x="54" y="332" font-size="10" fill="#8b949e" text-anchor="end" font-weight="normal">1e-4</text>
<line x1="62" y1="287" x2="690" y2="287" stroke="#8b949e" stroke-opacity="0.13"/>
<text x="54" y="291" font-size="10" fill="#8b949e" text-anchor="end" font-weight="normal">1e-3</text>
<line x1="62" y1="246" x2="690" y2="246" stroke="#8b949e" stroke-opacity="0.13"/>
<text x="54" y="250" font-size="10" fill="#8b949e" text-anchor="end" font-weight="normal">1e-2</text>
<line x1="62" y1="205" x2="690" y2="205" stroke="#8b949e" stroke-opacity="0.13"/>
<text x="54" y="209" font-size="10" fill="#8b949e" text-anchor="end" font-weight="normal">1e-1</text>
<line x1="62" y1="164" x2="690" y2="164" stroke="#8b949e" stroke-opacity="0.13"/>
<text x="54" y="168" font-size="10" fill="#8b949e" text-anchor="end" font-weight="normal">1e0</text>
<line x1="62" y1="123" x2="690" y2="123" stroke="#8b949e" stroke-opacity="0.13"/>
<text x="54" y="127" font-size="10" fill="#8b949e" text-anchor="end" font-weight="normal">1e1</text>
<line x1="62" y1="82" x2="690" y2="82" stroke="#8b949e" stroke-opacity="0.13"/>
<text x="54" y="86" font-size="10" fill="#8b949e" text-anchor="end" font-weight="normal">1e2</text>
<line x1="428.33333333333337" y1="82" x2="428.33333333333337" y2="328" stroke="#f0883e" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="433.33333333333337" y="94" font-size="10.5" fill="#f0883e" text-anchor="start" font-weight="normal">flag, 15 bits</text>
<line x1="480.66666666666663" y1="82" x2="480.66666666666663" y2="328" stroke="#f0883e" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="485.66666666666663" y="109" font-size="10.5" fill="#f0883e" text-anchor="start" font-weight="normal">checksum, 16 bits</text>
<path d="M62.0,267.2 L114.3,254.8 L166.7,242.5 L219.0,230.1 L271.3,217.8 L323.7,205.4 L376.0,193.1 L428.3,180.7 L480.7,168.4 L533.0,156.1 L585.3,143.7 L637.7,131.4 L690.0,119.0" fill="none" stroke="#3fb950" stroke-width="1.8"/>
<path d="M62.0,120.5 L114.3,133.4 L166.7,146.0 L219.0,158.5 L271.3,170.9 L323.7,183.3 L376.0,195.7 L428.3,208.0 L480.7,220.4 L533.0,232.7 L585.3,245.1 L637.7,257.4 L690.0,269.7" fill="none" stroke="#a371f7" stroke-width="1.8"/>
<path d="M271.3,92.3 L323.7,107.0 L376.0,120.5 L428.3,133.4 L480.7,146.0 L533.0,158.5 L585.3,170.9 L637.7,183.3 L690.0,195.7" fill="none" stroke="#a371f7" stroke-width="1.8" stroke-dasharray="5 3"/>
<circle cx="428.33333333333337" cy="180.73838198300467" r="3.5" fill="#3fb950"/>
<circle cx="428.33333333333337" cy="208.02757786796263" r="3.5" fill="#a371f7"/>
<circle cx="480.66666666666663" cy="168.39588045609906" r="3.5" fill="#3fb950"/>
<circle cx="480.66666666666663" cy="146.0489655922426" r="3.5" fill="#a371f7"/>
<text x="700" y="123.02670644654971" font-size="11" fill="#3fb950" text-anchor="start" font-weight="normal">diameter given up</text>
<text x="700" y="165" font-size="10" fill="#8b949e" text-anchor="start" font-weight="normal">flag, 15 bits, state solid</text>
<text x="700" y="181" font-size="10" fill="#3fb950" text-anchor="start" font-weight="normal">  0.39 per cent carrier</text>
<text x="700" y="197" font-size="10" fill="#a371f7" text-anchor="start" font-weight="normal">  16,384 states, 0.084 per cent</text>
<text x="700" y="213" font-size="10" fill="#f85149" text-anchor="start" font-weight="normal">  false accepts 1 in 2</text>
<text x="700" y="229" font-size="10" fill="#8b949e" text-anchor="start" font-weight="normal">checksum, 16 bits, state dashed</text>
<text x="700" y="245" font-size="10" fill="#3fb950" text-anchor="start" font-weight="normal">  0.78 per cent carrier</text>
<text x="700" y="261" font-size="10" fill="#a371f7" text-anchor="start" font-weight="normal">  512 states, 2.74 per cent</text>
<text x="700" y="277" font-size="10" fill="#f85149" text-anchor="start" font-weight="normal">  false accepts 1 in 128</text>
<line x1="62" y1="328" x2="690" y2="328" stroke="#8b949e" stroke-opacity="0.5"/>
<text x="62" y="346" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="normal">8</text>
<text x="166.66666666666666" y="346" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="normal">10</text>
<text x="271.3333333333333" y="346" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="normal">12</text>
<text x="376" y="346" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="normal">14</text>
<text x="480.66666666666663" y="346" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="normal">16</text>
<text x="585.3333333333334" y="346" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="normal">18</text>
<text x="690" y="346" font-size="10.5" fill="#8b949e" text-anchor="middle" font-weight="normal">20</text>
<text x="376" y="368" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal">field width taken from the carrier, bits</text>
<text transform="rotate(-90 14 205)" x="14" y="205" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="normal">cost, per cent</text>
</svg>
